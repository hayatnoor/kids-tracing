<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Let's Trace!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka One', cursive;
      height: 100vh;
      overflow: hidden;
      background: #f0f4ff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: flex; }

    /* ── WELCOME ── */
    #welcome {
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      background: linear-gradient(160deg, #f9a8d4 0%, #818cf8 100%);
    }

    .welcome-title {
      font-size: clamp(3.5rem, 13vw, 7rem);
      color: white;
      text-shadow: 0 7px 0 rgba(0,0,0,0.15);
      animation: float 2.2s ease-in-out infinite alternate;
      text-align: center;
      line-height: 1.15;
    }

    .welcome-sub {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: rgba(255,255,255,0.88);
      text-align: center;
    }

    .choice-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    @keyframes float {
      from { transform: translateY(0) rotate(-2deg); }
      to   { transform: translateY(-18px) rotate(2deg); }
    }

    /* ── BUTTONS ── */
    .btn {
      font-family: 'Fredoka One', cursive;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 80ms, box-shadow 80ms;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .btn:active {
      transform: translateY(4px) !important;
      box-shadow: none !important;
    }
    .btn-xl {
      font-size: clamp(1.8rem, 5vw, 3rem);
      padding: 18px 20px;
      box-shadow: 0 9px 0 rgba(0,0,0,0.22);
    }
    .btn-lg {
      font-size: clamp(1.1rem, 3.5vw, 1.7rem);
      padding: 13px 30px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    }
    .btn-icon {
      font-size: 1.6rem;
      width: 52px; height: 52px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 5px 0 rgba(0,0,0,0.14);
      flex-shrink: 0;
    }

    .yellow  { background: #fde047; color: #44330a; }
    .green   { background: #4ade80; color: #14532d; }
    .red     { background: #f87171; color: white;   }
    .blue    { background: #60a5fa; color: white;   }
    .purple  { background: #a78bfa; color: white;   }
    .white   { background: white;   color: #555;    }

    /* ── MODE SELECT ── */
    #mode-select {
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: linear-gradient(160deg, #6ee7f7 0%, #818cf8 100%);
    }

    .mode-select-emoji {
      font-size: clamp(3rem, 12vw, 5.5rem);
      animation: float 2.2s ease-in-out infinite alternate;
    }

    .mode-select-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(1.3rem, 4.5vw, 2.2rem);
      color: rgba(255,255,255,0.92);
      text-align: center;
    }

    /* ── TRACING SCREEN ── */
    #tracing {
      height: 100vh;
      flex-direction: column;
      background: linear-gradient(160deg, #e0f2fe 0%, #ede9fe 100%);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      flex-shrink: 0;
      gap: 10px;
    }

    .char-label {
      font-size: clamp(1.1rem, 4vw, 1.9rem);
      color: #5b21b6;
      flex: 1;
      text-align: center;
    }

    /* Canvas area */
    .canvas-wrap {
      flex: 1;
      max-height: 58vh;
      position: relative;
      margin: 0 12px;
      border-radius: 28px;
      overflow: hidden;
      background: white;
      box-shadow: 0 8px 32px rgba(100, 80, 200, 0.2);
      min-height: 0;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
      display: block;
    }

    #guide-canvas { z-index: 1; }
    #draw-canvas  { z-index: 2; }

    /* Progress */
    .progress-row {
      display: flex;
      gap: 7px;
      justify-content: center;
      padding: 8px 12px 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(130,100,200,0.22);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .dot.done    { background: #4ade80; }
    .dot.current { background: #818cf8; }

    /* Bottom bar */
    .bottom-bar {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      padding: 10px 16px 18px;
      flex-shrink: 0;
    }

    /* ── RESULT OVERLAY ── */
    #result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(25,15,55,0.74);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    #result-overlay.active { display: flex; }

    .result-card {
      background: white;
      border-radius: 36px;
      padding: clamp(24px, 6vw, 52px);
      text-align: center;
      width: min(92vw, 460px);
      animation: popIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.4) translateY(40px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    .result-big-emoji {
      font-size: clamp(3.5rem, 13vw, 6rem);
      display: block;
      margin-bottom: 6px;
      animation: wobble 0.55s ease-in-out;
    }
    @keyframes wobble {
      0%,100% { transform: rotate(0)    scale(1);   }
      25%      { transform: rotate(-14deg) scale(1.25); }
      75%      { transform: rotate(14deg)  scale(1.25); }
    }

    .result-msg {
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      margin-bottom: 4px;
    }
    .result-sub {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(0.95rem, 3vw, 1.3rem);
      color: #888;
      margin-bottom: 14px;
    }

    .stars-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 10px 0 22px;
    }
    .star-item {
      font-size: clamp(2rem, 7vw, 3rem);
      opacity: 0;
      animation: starBurst 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes starBurst {
      from { transform: scale(0) rotate(-45deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    .result-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── SHAKE ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%     { transform: translateX(-12px); }
      30%     { transform: translateX(12px); }
      45%     { transform: translateX(-8px); }
      60%     { transform: translateX(8px); }
      75%     { transform: translateX(-4px); }
      90%     { transform: translateX(4px); }
    }
    .shake { animation: shake 0.45s ease-in-out; }

    /* ── CONFETTI ── */
    .confetto {
      position: fixed;
      pointer-events: none;
      z-index: 600;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(-80px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh)  rotate(720deg); opacity: 0; }
    }

    /* ── MATH SCREEN ── */
    #math-screen {
      height: 100vh;
      flex-direction: column;
      background: linear-gradient(160deg, #fef9c3 0%, #bbf7d0 100%);
    }

    #math-screen .char-label { color: #365314; }

    .math-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 20px;
      min-height: 0;
      background: white;
      margin: 0 12px;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(80, 140, 80, 0.18);
      max-height: 50vh;
    }

    .math-emoji-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .math-emoji-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      font-size: clamp(1.8rem, 6.5vw, 3.2rem);
      max-width: 88vw;
      line-height: 1.3;
    }

    .math-op-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      color: #6b7280;
    }

    .math-equation {
      font-size: clamp(2.8rem, 11vw, 5.5rem);
      color: #365314;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .math-choices {
      display: flex;
      gap: clamp(10px, 3vw, 22px);
      justify-content: center;
      padding: 14px 16px 20px;
      flex-shrink: 0;
    }

    .choice-btn {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      width: clamp(68px, 19vw, 120px);
      height: clamp(68px, 19vw, 120px);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      transition: transform 80ms, box-shadow 80ms;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .choice-btn:active {
      transform: translateY(4px) !important;
      box-shadow: none !important;
    }
    .choice-btn:disabled {
      opacity: 0.55;
      cursor: default;
      pointer-events: none;
    }

    /* ── SIGHT WORDS SCREEN ── */
    #sight-screen {
      height: 100vh;
      flex-direction: column;
      background: linear-gradient(160deg, #fce7f3 0%, #dbeafe 100%);
    }

    #sight-screen .char-label { color: #9d174d; }

    .sight-listen-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 12px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(219,39,119,0.13);
      min-height: 0;
      max-height: 45vh;
    }

    .listen-btn {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.6rem, 5.5vw, 2.6rem);
      padding: clamp(18px, 4vw, 32px) clamp(28px, 7vw, 52px);
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 80ms, box-shadow 80ms;
    }
    .listen-btn:active {
      transform: translateY(4px) !important;
      box-shadow: none !important;
    }
    .listen-btn.speaking {
      animation: listenPulse 0.75s ease-in-out infinite;
    }
    @keyframes listenPulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 8px 0 rgba(0,0,0,0.18); }
      50%       { transform: scale(1.07); box-shadow: 0 10px 0 rgba(0,0,0,0.18); }
    }

    .sight-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 2.5vw, 18px);
      padding: 12px 12px 10px;
      flex-shrink: 0;
    }

    .sight-card {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.5rem, 6vw, 2.8rem);
      background: white;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      padding: clamp(14px, 3.5vw, 26px) 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 80ms, box-shadow 80ms;
      text-align: center;
      color: #1e293b;
    }
    .sight-card:active {
      transform: translateY(3px) !important;
      box-shadow: none !important;
    }
    .sight-card:disabled { pointer-events: none; }
    .sight-card.correct {
      background: #dcfce7;
      border-color: #4ade80;
      color: #15803d;
    }
    @keyframes sightShake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-9px); }
      40%     { transform: translateX(9px); }
      60%     { transform: translateX(-5px); }
      80%     { transform: translateX(5px); }
    }
  </style>
</head>
<body>

<!-- ═══════════════ WELCOME ═══════════════ -->
<div id="welcome" class="screen active">
  <div class="welcome-title">✏️<br>Let's Learn!</div>
  <div class="welcome-sub">Choose what to practice 👇</div>
  <div class="choice-row">
    <button class="btn btn-xl yellow" onclick="startMode('letters')">🔤 Letters</button>
    <button class="btn btn-xl green"  onclick="startMode('numbers')">🔢 Numbers</button>
    <button class="btn btn-xl" style="background:#fb923c;color:#7c2d12;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startMath()">🧮 Math</button>
    <button class="btn btn-xl" style="background:#ec4899;color:white;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startSight()">📖 Sight Words</button>
  </div>
</div>

<!-- ═══════════════ MODE SELECT ═══════════════ -->
<div id="mode-select" class="screen">
  <div class="mode-select-emoji" id="mode-select-emoji">🔤</div>
  <div class="mode-select-title">How do you want to practice?</div>
  <div class="choice-row">
    <button class="btn btn-xl yellow" onclick="startSubMode('tracing')">✏️ Trace it</button>
    <button class="btn btn-xl blue"   onclick="startSubMode('writing')">🖊️ Write it</button>
  </div>
  <button class="btn btn-lg white" onclick="goHome()" style="box-shadow:0 5px 0 rgba(0,0,0,0.12);">← Back</button>
</div>

<!-- ═══════════════ TRACING ═══════════════ -->
<div id="tracing" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="char-label">Trace the letter A</div>
    <button class="btn btn-icon white" onclick="skipCurrent()" title="Skip">⏭</button>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="guide-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
  </div>

  <div class="progress-row" id="progress-row"></div>

  <div class="bottom-bar">
    <button class="btn btn-lg red"   onclick="clearDrawing()">🗑 Clear</button>
    <button class="btn btn-lg green" onclick="checkTrace()">⭐ Check!</button>
  </div>
</div>

<!-- ═══════════════ MATH ═══════════════ -->
<div id="math-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="math-label">Question 1 of 10</div>
    <div style="width:52px;flex-shrink:0"></div>
  </div>

  <div class="math-display" id="math-display"></div>

  <div class="math-choices" id="math-choices"></div>

  <div class="progress-row" id="math-progress-row"></div>
</div>

<!-- ═══════════════ SIGHT WORDS ═══════════════ -->
<div id="sight-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="sight-label">Word 1 of 10</div>
    <div style="width:52px;flex-shrink:0"></div>
  </div>

  <div class="sight-listen-wrap">
    <button id="sight-listen-btn" class="listen-btn" onclick="speakWord(currentWord)">🔊 Hear it again!</button>
  </div>

  <div id="sight-grid" class="sight-grid"></div>

  <div class="progress-row" id="sight-progress-row"></div>
</div>

<!-- ═══════════════ RESULT OVERLAY ═══════════════ -->
<div id="result-overlay">
  <div class="result-card">
    <span class="result-big-emoji" id="r-emoji">🎉</span>
    <div class="result-msg" id="r-msg">Amazing!</div>
    <div class="result-sub" id="r-sub">You traced it perfectly!</div>
    <div class="stars-row"  id="r-stars"></div>
    <div class="result-btns">
      <button id="btn-try-again" class="btn btn-lg red"  onclick="tryAgain()">🔄 Try Again</button>
      <button id="btn-next"      class="btn btn-lg blue" onclick="nextChar()">Next ▶</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────────
const LETTERS = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const NUMBERS = [...'0123456789'];
const BRUSH   = 26;
const DRAW_COLOR = '#7c3aed';

// ── STATE ──────────────────────────────────────────────────────
let mode    = 'letters';
let submode = 'tracing'; // 'tracing' | 'writing'
let items   = LETTERS;
let idx     = 0;
let drawing = false;
let done    = new Set();
let canvasW = 0, canvasH = 0;

// ── CANVAS REFS ────────────────────────────────────────────────
const wrap     = document.getElementById('canvas-wrap');
const guideC   = document.getElementById('guide-canvas');
const drawC    = document.getElementById('draw-canvas');
const guideCtx = guideC.getContext('2d');
const drawCtx  = drawC.getContext('2d');

const tmplC   = document.createElement('canvas');
const tmplCtx = tmplC.getContext('2d');
tmplC.style.cssText = 'position:fixed;top:-9999px;opacity:0;pointer-events:none;';
document.body.appendChild(tmplC);

// ── RESIZE ────────────────────────────────────────────────────
function resize() {
  const { width: W, height: H } = wrap.getBoundingClientRect();
  const dpr = Math.ceil(window.devicePixelRatio) || 1;
  canvasW = W;
  canvasH = H;
  [guideC, drawC, tmplC].forEach(c => {
    c.width        = W * dpr;
    c.height       = H * dpr;
    c.style.width  = `${W}px`;
    c.style.height = `${H}px`;
  });
  [guideCtx, drawCtx, tmplCtx].forEach(ctx => ctx.setTransform(dpr, 0, 0, dpr, 0, 0));
  renderGuide();
}
window.addEventListener('resize', () => { resize(); clearDrawing(); });

// ── GUIDE RENDERING ───────────────────────────────────────────
function renderGuide() {
  const W = canvasW, H = canvasH;
  if (!W || !H) return;

  const char = items[idx];
  const fs   = Math.round(Math.min(W, H) * 0.76);
  const font = `900 ${fs}px 'Nunito', 'Arial Black', Arial`;

  tmplCtx.clearRect(0, 0, W, H);
  tmplCtx.font            = font;
  tmplCtx.textAlign       = 'center';
  tmplCtx.textBaseline    = 'middle';
  tmplCtx.fillStyle       = '#000';
  tmplCtx.fillText(char, W / 2, H / 2);

  guideCtx.clearRect(0, 0, W, H);

  if (submode === 'tracing') {
    guideCtx.font         = font;
    guideCtx.textAlign    = 'center';
    guideCtx.textBaseline = 'middle';
    guideCtx.fillStyle = 'rgba(109,40,217,0.18)';
    guideCtx.fillText(char, W / 2, H / 2);
    guideCtx.strokeStyle = 'rgba(109,40,217,0.45)';
    guideCtx.lineWidth   = Math.max(2, fs * 0.012);
    guideCtx.lineJoin    = 'round';
    guideCtx.setLineDash([fs * 0.04, fs * 0.025]);
    guideCtx.strokeText(char, W / 2, H / 2);
    guideCtx.setLineDash([]);
  }
}

function clamp(min, val, max) { return Math.max(min, Math.min(max, val)); }

// ── DRAWING ───────────────────────────────────────────────────
function eventPos(e) {
  const rect = drawC.getBoundingClientRect();
  const src  = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
  return {
    x: src.clientX - rect.left,
    y: src.clientY - rect.top
  };
}

function onDown(e) {
  e.preventDefault();
  drawing = true;

  const col = DRAW_COLOR;
  drawCtx.lineWidth   = BRUSH * 2;
  drawCtx.lineCap     = 'round';
  drawCtx.lineJoin    = 'round';
  drawCtx.strokeStyle = col;
  drawCtx.fillStyle   = col;

  const p = eventPos(e);
  drawCtx.beginPath();
  drawCtx.arc(p.x, p.y, BRUSH, 0, Math.PI * 2);
  drawCtx.fill();

  drawCtx.beginPath();
  drawCtx.moveTo(p.x, p.y);
}

function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const p = eventPos(e);
  drawCtx.lineTo(p.x, p.y);
  drawCtx.stroke();
  drawCtx.beginPath();
  drawCtx.moveTo(p.x, p.y);
}

function onUp(e) {
  e.preventDefault();
  if (!drawing) return;
  drawing = false;
  drawCtx.beginPath();
}

drawC.addEventListener('touchstart', onDown, { passive: false });
drawC.addEventListener('touchmove',  onMove, { passive: false });
drawC.addEventListener('touchend',   onUp,   { passive: false });
drawC.addEventListener('mousedown',  onDown);
drawC.addEventListener('mousemove',  onMove);
drawC.addEventListener('mouseup',    onUp);
drawC.addEventListener('mouseleave', onUp);

// ── CLEAR ─────────────────────────────────────────────────────
function clearDrawing() {
  drawCtx.clearRect(0, 0, canvasW, canvasH);
}

// ── ASSESSMENT ────────────────────────────────────────────────
function checkTrace() {
  const W = drawC.width, H = drawC.height;
  if (!W || !H) return;

  const STEP = 3;
  const SW = Math.ceil(W / STEP);
  const SH = Math.ceil(H / STEP);
  const N  = SW * SH;

  const tPx = tmplCtx.getImageData(0, 0, W, H).data;
  const dPx = drawCtx.getImageData(0, 0, W, H).data;

  const tGrid = new Uint8Array(N);
  const dGrid = new Uint8Array(N);

  for (let sy = 0; sy < SH; sy++) {
    for (let sx = 0; sx < SW; sx++) {
      let tMax = 0, dMax = 0;
      for (let dy = 0; dy < STEP; dy++) {
        for (let dx = 0; dx < STEP; dx++) {
          const px = sx * STEP + dx, py = sy * STEP + dy;
          if (px >= W || py >= H) continue;
          const i = (py * W + px) * 4;
          tMax = Math.max(tMax, tPx[i + 3]);
          dMax = Math.max(dMax, dPx[i + 3]);
        }
      }
      tGrid[sy * SW + sx] = tMax > 15 ? 1 : 0;
      dGrid[sy * SW + sx] = dMax > 15 ? 1 : 0;
    }
  }

  const DR = Math.ceil(BRUSH * (window.devicePixelRatio || 1) / STEP);

  function dilate(grid) {
    const out = new Uint8Array(N);
    for (let sy = 0; sy < SH; sy++) {
      for (let sx = 0; sx < SW; sx++) {
        if (!grid[sy * SW + sx]) continue;
        for (let dy = -DR; dy <= DR; dy++) {
          const ny = sy + dy;
          if (ny < 0 || ny >= SH) continue;
          for (let dx = -DR; dx <= DR; dx++) {
            if (dx * dx + dy * dy > DR * DR) continue;
            const nx = sx + dx;
            if (nx >= 0 && nx < SW) out[ny * SW + nx] = 1;
          }
        }
      }
    }
    return out;
  }

  const dDilated = dilate(dGrid);
  const tDilated = dilate(tGrid);

  let tTotal = 0, tCovered = 0, dTotal = 0, dInside = 0;
  for (let i = 0; i < N; i++) {
    if (tGrid[i]) { tTotal++;  if (dDilated[i]) tCovered++; }
    if (dGrid[i]) { dTotal++;  if (tDilated[i]) dInside++;  }
  }

  if (tTotal === 0) {
    renderGuide();
    const retryData = tmplCtx.getImageData(0, 0, W, H).data;
    for (let i = 3; i < retryData.length; i += 4) {
      if (retryData[i] > 15) { checkTrace(); return; }
    }
    return;
  }

  const coverage  = tCovered / tTotal;
  const precision = dTotal > 0 ? dInside / dTotal : 0;
  const score     = 0.60 * coverage + 0.40 * precision;

  let stars;
  if (dTotal < 150)      stars = 0;
  else if (score < 0.30) stars = 1;
  else if (score < 0.50) stars = 2;
  else if (score < 0.80) stars = 3;
  else if (score < 0.95) stars = 4;
  else                   stars = 5;

  showResult(stars);
}

// ── RESULT UI ─────────────────────────────────────────────────
const RESULTS = [
  { emoji:'✏️', msg:'Try Again!',     sub:'Draw on the letter and try again.',     color:'#94a3b8' },
  { emoji:'😬', msg:'Not Quite!',     sub:'Stay closer to the letter.',            color:'#f97316' },
  { emoji:'😐', msg:'Keep Going!',    sub:'Trace the whole letter to move on.',    color:'#eab308' },
  { emoji:'😅', msg:'Almost There!',  sub:'Trace more carefully to move on.',      color:'#f59e0b' },
  { emoji:'🔥', msg:'So Close!',      sub:'Nearly perfect — give it one more try!',color:'#3b82f6' },
  { emoji:'🏆', msg:'AMAZING!',       sub:'Perfect! You rock! 🎊',                color:'#a855f7' },
];

function showResult(stars) {
  const minStars = submode === 'writing' ? 4 : 5;
  if (stars < minStars) {
    playSound('error');
    shakeCanvas();
    clearDrawing();
    return;
  }

  done.add(idx);
  updateDots();

  document.getElementById('btn-try-again').textContent = '🔄 Try Again';
  document.getElementById('btn-next').textContent      = 'Next ▶';

  const r = RESULTS[5];
  document.getElementById('r-emoji').textContent   = r.emoji;
  document.getElementById('r-msg').textContent     = r.msg;
  document.getElementById('r-msg').style.color     = r.color;
  document.getElementById('r-sub').textContent     = submode === 'writing'
    ? 'You wrote it! Great job! 🎊'
    : r.sub;

  const row = document.getElementById('r-stars');
  row.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'star-item';
    s.textContent = '⭐';
    s.style.animationDelay = `${i * 0.12}s`;
    s.style.color = '#facc15';
    row.appendChild(s);
  }

  document.getElementById('result-overlay').classList.add('active');
  playSound('win');
  launchConfetti();
}

function tryAgain() {
  document.getElementById('result-overlay').classList.remove('active');
  if (mode === 'math' || mode === 'sight') {
    goHome();
  } else {
    clearDrawing();
  }
}

function nextChar() {
  document.getElementById('result-overlay').classList.remove('active');
  if (mode === 'math') {
    startMath();
  } else if (mode === 'sight') {
    startSight();
  } else {
    idx = (idx + 1) % items.length;
    loadChar();
  }
}

// ── SOUND ─────────────────────────────────────────────────────
let actx;
function getACtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}

function tone(freq, start, dur) {
  try {
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.22, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime  + start + dur + 0.05);
  } catch (_) {}
}

function buzz(freq, start, dur) {
  try {
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.18, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime  + start + dur + 0.05);
  } catch (_) {}
}

function playSound(type) {
  if (type === 'win')   { tone(523,.00,.12); tone(659,.13,.12); tone(784,.26,.12); tone(1047,.39,.3); }
  else if (type === 'error') { buzz(220,.00,.14); buzz(175,.15,.28); }
}

function shakeCanvas() {
  const el = document.getElementById('canvas-wrap');
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
}

// ── CONFETTI ──────────────────────────────────────────────────
function launchConfetti() {
  const palette = ['#f87171','#fde047','#4ade80','#60a5fa','#c084fc','#fb923c','#34d399'];
  for (let i = 0; i < 75; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetto';
      const size = 10 + Math.random() * 14;
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: -50px;
        width: ${size}px;
        height: ${size}px;
        background: ${palette[Math.floor(Math.random() * palette.length)]};
        border-radius: ${Math.random() > 0.5 ? '50%' : '3px'};
        animation-duration: ${1.8 + Math.random() * 2}s;
        animation-delay: ${Math.random() * 0.7}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i * 22);
  }
}

// ── NAVIGATION ────────────────────────────────────────────────
function startMode(m) {
  mode  = m;
  items = m === 'letters' ? LETTERS : NUMBERS;
  idx   = 0;
  done.clear();

  document.getElementById('mode-select-emoji').textContent = m === 'letters' ? '🔤' : '🔢';
  document.getElementById('welcome').classList.remove('active');
  document.getElementById('mode-select').classList.add('active');
}

function startSubMode(sub) {
  submode = sub;
  document.getElementById('mode-select').classList.remove('active');
  document.getElementById('tracing').classList.add('active');
  buildDots();
  setLabel();
  document.fonts.ready.then(() => { resize(); });
}

function setLabel() {
  const verb = submode === 'writing' ? 'Write' : 'Trace';
  const noun = mode === 'letters' ? 'letter' : 'number';
  document.getElementById('char-label').textContent = `${verb} the ${noun} ${items[idx]}`;
}

function loadChar() {
  clearDrawing();
  setLabel();
  renderGuide();
  updateDots();
}

function skipCurrent() {
  idx = (idx + 1) % items.length;
  loadChar();
}

function goHome() {
  document.getElementById('result-overlay').classList.remove('active');
  document.getElementById('tracing').classList.remove('active');
  document.getElementById('mode-select').classList.remove('active');
  document.getElementById('math-screen').classList.remove('active');
  document.getElementById('sight-screen').classList.remove('active');
  document.getElementById('welcome').classList.add('active');
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

// ── PROGRESS DOTS ─────────────────────────────────────────────
function buildDots() {
  const row = document.getElementById('progress-row');
  row.innerHTML = items.map((_, i) => `<div class="dot" id="d${i}"></div>`).join('');
  updateDots();
}

function updateDots() {
  items.forEach((_, i) => {
    const d = document.getElementById(`d${i}`);
    if (!d) return;
    d.className = 'dot' + (done.has(i) ? ' done' : i === idx ? ' current' : '');
  });
}

// ── MATH MODE ─────────────────────────────────────────────────
const MATH_TOTAL = 10;
const MATH_EMOJI = ['⭐','🍎','🐶','🦋','🎈','🐠','🍭','🐸','🌸','🏀'];

let mathCorrect         = 0;
let mathQuestion        = 0;
let currentProblem      = null;
let mathAttempts        = [];
let mathCurrentAttempts = 0;

function startMath() {
  mode         = 'math';
  mathCorrect         = 0;
  mathQuestion        = 0;
  mathAttempts        = [];
  mathCurrentAttempts = 0;

  document.getElementById('welcome').classList.remove('active');
  document.getElementById('math-screen').classList.add('active');

  buildMathDots();
  nextMathProblem();
}

function generateProblem() {
  const emoji = MATH_EMOJI[Math.floor(Math.random() * MATH_EMOJI.length)];
  const isAdd = Math.random() > 0.35;

  let a, b, answer, op;
  if (isAdd) {
    a = Math.floor(Math.random() * 5) + 1; // 1–5
    b = Math.floor(Math.random() * 5) + 1; // 1–5
    while (a + b > 10) b = Math.floor(Math.random() * 5) + 1;
    answer = a + b;
    op = '+';
  } else {
    a = Math.floor(Math.random() * 7) + 3;               // 3–9
    b = Math.floor(Math.random() * Math.min(a - 1, 4)) + 1; // 1–min(a-1, 4)
    answer = a - b;
    op = '−';
  }

  // Three wrong choices close to the correct answer
  const wrongs = new Set();
  let tries = 0;
  while (wrongs.size < 3 && tries < 60) {
    tries++;
    const d = Math.floor(Math.random() * 3) + 1;
    const w = answer + (Math.random() > 0.5 ? d : -d);
    if (w !== answer && w >= 0 && w <= 10) wrongs.add(w);
  }
  for (let n = 0; n <= 10 && wrongs.size < 3; n++) {
    if (n !== answer) wrongs.add(n);
  }

  const choices = [answer, ...[...wrongs].slice(0, 3)].sort(() => Math.random() - 0.5);
  return { a, b, answer, op, choices, emoji };
}

function nextMathProblem() {
  mathCurrentAttempts = 0;
  mathQuestion++;
  document.getElementById('math-label').textContent = `Question ${mathQuestion} of ${MATH_TOTAL}`;
  currentProblem = generateProblem();
  renderMathProblem();
}

function renderMathProblem() {
  const { a, b, op, choices, emoji } = currentProblem;
  const display = document.getElementById('math-display');

  const makeRow = n => Array(n).fill(`<span>${emoji}</span>`).join('');

  let emojiHTML;
  if (op === '+') {
    emojiHTML = `
      <div class="math-emoji-group">
        <div class="math-emoji-row">${makeRow(a)}</div>
        <div class="math-op-label">plus</div>
        <div class="math-emoji-row">${makeRow(b)}</div>
      </div>`;
  } else {
    emojiHTML = `
      <div class="math-emoji-group">
        <div class="math-emoji-row">${makeRow(a)}</div>
        <div class="math-op-label">take away ${b}</div>
      </div>`;
  }

  display.innerHTML = `${emojiHTML}<div class="math-equation">${a} ${op} ${b} = ?</div>`;

  const btnColors = ['yellow', 'blue', 'green', 'purple'];
  const shuffledColors = [...btnColors].sort(() => Math.random() - 0.5);
  document.getElementById('math-choices').innerHTML = choices.map((c, i) =>
    `<button class="btn choice-btn ${shuffledColors[i]}" onclick="checkMathAnswer(${c})">${c}</button>`
  ).join('');
}

function checkMathAnswer(answer) {
  if (answer === currentProblem.answer) {
    mathAttempts.push(mathCurrentAttempts);
    mathCorrect++;
    updateMathDots();
    playSound('win');
    launchConfetti();

    document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });

    if (mathCorrect >= MATH_TOTAL) {
      setTimeout(showMathComplete, 900);
    } else {
      setTimeout(nextMathProblem, 1100);
    }
  } else {
    mathCurrentAttempts++;
    playSound('error');
    const display = document.getElementById('math-display');
    display.classList.remove('shake');
    void display.offsetWidth;
    display.classList.add('shake');
    display.addEventListener('animationend', () => display.classList.remove('shake'), { once: true });
  }
}

function showMathComplete() {
  const firstTry = mathAttempts.filter(a => a === 0).length;
  const stars = firstTry >= 10 ? 5
              : firstTry >= 8  ? 4
              : firstTry >= 6  ? 3
              : firstTry >= 4  ? 2
              : 1;
  const subText = firstTry === MATH_TOTAL
    ? `Perfect! All ${MATH_TOTAL} problems on the first try! 🎊`
    : `${firstTry} out of ${MATH_TOTAL} on your first try!`;

  document.getElementById('r-emoji').textContent        = '🏆';
  document.getElementById('r-msg').textContent          = 'Math Star!';
  document.getElementById('r-msg').style.color          = '#a855f7';
  document.getElementById('r-sub').textContent          = subText;
  document.getElementById('btn-try-again').textContent  = '🏠 Home';
  document.getElementById('btn-next').textContent       = '🔄 Play Again';

  const row = document.getElementById('r-stars');
  row.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'star-item';
    s.textContent = i < stars ? '⭐' : '☆';
    s.style.animationDelay = `${i * 0.12}s`;
    s.style.color = i < stars ? '#facc15' : '#d1d5db';
    row.appendChild(s);
  }

  document.getElementById('result-overlay').classList.add('active');
  playSound('win');
  launchConfetti();
}

function buildMathDots() {
  const row = document.getElementById('math-progress-row');
  row.innerHTML = Array.from({ length: MATH_TOTAL }, (_, i) =>
    `<div class="dot" id="md${i}"></div>`
  ).join('');
  updateMathDots();
}

function updateMathDots() {
  for (let i = 0; i < MATH_TOTAL; i++) {
    const d = document.getElementById(`md${i}`);
    if (!d) return;
    if (i < mathCorrect)      d.className = 'dot done';
    else if (i === mathCorrect) d.className = 'dot current';
    else                       d.className = 'dot';
  }
}

// ── SIGHT WORDS MODE ──────────────────────────────────────────
const SIGHT_WORDS = [
  'all','am','are','at','be','but', 'is', 'for',
  'did','do','get','good','have','he','into', 'it', 'go',
  'no','now','on','our','out','ran', 'hat', 'bat', 'cat',
  'saw','say','she','so','soon','that','there','they','this',
  'too','want','was','well','went','what', 'we',
  'who','will','with','yes', 'my'
];

const SIGHT_TOTAL = 10;
let sightDone            = 0;
let sightQuestion        = 0;
let currentWord          = null;
let sightUsed            = [];
let sightAttempts        = []; // wrong-answer count per question
let sightCurrentAttempts = 0;

function startSight() {
  mode          = 'sight';
  sightDone            = 0;
  sightQuestion        = 0;
  sightUsed            = [];
  sightAttempts        = [];
  sightCurrentAttempts = 0;

  document.getElementById('welcome').classList.remove('active');
  document.getElementById('sight-screen').classList.add('active');

  buildSightDots();
  nextSightWord();
}

function nextSightWord() {
  sightQuestion++;
  sightCurrentAttempts = 0;
  document.getElementById('sight-label').textContent = `Word ${sightQuestion} of ${SIGHT_TOTAL}`;

  const available = SIGHT_WORDS.filter(w => !sightUsed.includes(w));
  currentWord = available[Math.floor(Math.random() * available.length)];
  sightUsed.push(currentWord);
  if (sightUsed.length > 20) sightUsed.shift();

  renderSightChoices();
  setTimeout(() => speakWord(currentWord), 500);
}

function renderSightChoices() {
  const others = SIGHT_WORDS.filter(w => w !== currentWord);
  const wrongs = [];
  while (wrongs.length < 3) {
    const w = others[Math.floor(Math.random() * others.length)];
    if (!wrongs.includes(w)) wrongs.push(w);
  }

  const choices = [currentWord, ...wrongs].sort(() => Math.random() - 0.5);
  document.getElementById('sight-grid').innerHTML = choices.map(w =>
    `<button class="sight-card" onclick="checkSightAnswer('${w}')">${w}</button>`
  ).join('');
}

function speakWord(word) {
  if (!window.speechSynthesis || !word) return;
  window.speechSynthesis.cancel();

  const btn = document.getElementById('sight-listen-btn');

  function doSpeak(voices) {
    const utt = new SpeechSynthesisUtterance(word);
    utt.rate   = 0.7;
    utt.pitch  = 1.15;
    utt.volume = 1;

    const preferred = ['Samantha (Enhanced)', 'Samantha', 'Karen', 'Moira', 'Tessa', 'Fiona', 'Victoria'];
    const pick =
      preferred.map(n => voices.find(v => v.name === n)).find(Boolean) ||
      voices.find(v => v.lang.startsWith('en-US') && !v.name.includes('Alex')) ||
      voices.find(v => v.lang.startsWith('en'));
    if (pick) utt.voice = pick;
    console.log('Speaking with voice:', pick ? pick.name : 'default', 'Available:', voices.map(v => v.name));

    if (btn) btn.classList.add('speaking');
    utt.onend  = () => { if (btn) btn.classList.remove('speaking'); };
    utt.onerror = () => { if (btn) btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(utt);
  }

  const voices = window.speechSynthesis.getVoices();
  if (voices.length) {
    doSpeak(voices);
  } else {
    // Voices not loaded yet — wait for them
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = null;
      doSpeak(window.speechSynthesis.getVoices());
    };
  }
}

function checkSightAnswer(word) {
  const cards = document.querySelectorAll('.sight-card');

  if (word === currentWord) {
    cards.forEach(c => {
      c.disabled = true;
      if (c.textContent.trim() === word) c.classList.add('correct');
    });
    sightAttempts.push(sightCurrentAttempts);
    sightDone++;
    updateSightDots();
    playSound('win');
    launchConfetti();

    if (sightDone >= SIGHT_TOTAL) {
      setTimeout(showSightComplete, 900);
    } else {
      setTimeout(nextSightWord, 1200);
    }
  } else {
    sightCurrentAttempts++;
    playSound('error');
    cards.forEach(c => {
      if (c.textContent.trim() !== word) return;
      c.style.background  = '#fee2e2';
      c.style.borderColor = '#f87171';
      c.style.color       = '#dc2626';
      c.style.animation   = 'sightShake 0.45s ease-in-out';
      c.addEventListener('animationend', () => {
        c.style.background  = '';
        c.style.borderColor = '';
        c.style.color       = '';
        c.style.animation   = '';
      }, { once: true });
    });
  }
}

function showSightComplete() {
  const firstTry = sightAttempts.filter(a => a === 0).length;
  const stars = firstTry >= 10 ? 5
              : firstTry >= 8  ? 4
              : firstTry >= 6  ? 3
              : firstTry >= 4  ? 2
              : 1;
  const subText = firstTry === SIGHT_TOTAL
    ? `Perfect! All ${SIGHT_TOTAL} words on the first try! 🎊`
    : `${firstTry} out of ${SIGHT_TOTAL} on your first try!`;

  document.getElementById('r-emoji').textContent       = '📚';
  document.getElementById('r-msg').textContent         = 'Word Star!';
  document.getElementById('r-msg').style.color         = '#db2777';
  document.getElementById('r-sub').textContent         = subText;
  document.getElementById('btn-try-again').textContent = '🏠 Home';
  document.getElementById('btn-next').textContent      = '🔄 Play Again';

  const row = document.getElementById('r-stars');
  row.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'star-item';
    s.textContent = i < stars ? '⭐' : '☆';
    s.style.animationDelay = `${i * 0.12}s`;
    s.style.color = i < stars ? '#facc15' : '#d1d5db';
    row.appendChild(s);
  }

  document.getElementById('result-overlay').classList.add('active');
  playSound('win');
  launchConfetti();
}

function buildSightDots() {
  const row = document.getElementById('sight-progress-row');
  row.innerHTML = Array.from({ length: SIGHT_TOTAL }, (_, i) =>
    `<div class="dot" id="sd${i}"></div>`
  ).join('');
  updateSightDots();
}

function updateSightDots() {
  for (let i = 0; i < SIGHT_TOTAL; i++) {
    const d = document.getElementById(`sd${i}`);
    if (!d) return;
    if (i < sightDone)        d.className = 'dot done';
    else if (i === sightDone) d.className = 'dot current';
    else                      d.className = 'dot';
  }
}

document.addEventListener('touchmove',  e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
