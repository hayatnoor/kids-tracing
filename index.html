<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tiny Thinkers</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ═══════════════ WELCOME ═══════════════ -->
<div id="welcome" class="screen active">
  <div class="welcome-title">Tiny Thinkers</div>
  <div class="welcome-sub">Choose what to practice 👇</div>
  <div class="choice-row">
    <button class="btn btn-xl yellow" onclick="startMode('letters')">🔤 Letters</button>
    <button class="btn btn-xl green"  onclick="startMode('numbers')">🔢 Numbers</button>
    <button class="btn btn-xl" style="background:#fb923c;color:#7c2d12;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startMath()">🧮 Math</button>
    <button class="btn btn-xl" style="background:#ec4899;color:white;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startSight()">📖 Sight Words</button>
    <button class="btn btn-xl" style="background:#0d9488;color:white;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startArabic()">🌙 Arabic</button>
    <button class="btn btn-xl" style="background:#6366f1;color:white;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startShapes()">🔷 Shapes</button>
    <button class="btn btn-xl" style="background:#f59e0b;color:#78350f;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startMatching()">🚗 Matching</button>
  </div>
</div>

<!-- ═══════════════ MODE SELECT ═══════════════ -->
<div id="mode-select" class="screen">
  <div class="mode-select-emoji" id="mode-select-emoji">🔤</div>
  <div class="mode-select-title">How do you want to practice?</div>
  <div class="choice-row">
    <button class="btn btn-xl yellow" onclick="startSubMode('tracing')">✏️ Trace it</button>
    <button class="btn btn-xl blue"   onclick="startSubMode('writing')">🖊️ Write it</button>
  </div>
  <button class="btn btn-lg white" onclick="goHome()" style="box-shadow:0 5px 0 rgba(0,0,0,0.12);">← Back</button>
</div>

<!-- ═══════════════ TRACING ═══════════════ -->
<div id="tracing" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="char-label">Trace the letter A</div>
    <button class="btn btn-icon white" onclick="skipCurrent()" title="Skip">⏭</button>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="guide-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
  </div>

  <div class="progress-row" id="progress-row"></div>

  <div class="bottom-bar">
    <button class="btn btn-lg red"   onclick="clearDrawing()">🗑 Clear</button>
    <button class="btn btn-lg green" onclick="checkTrace()">⭐ Check!</button>
  </div>
  <div id="score-debug" style="
    text-align:center;
    font-family:'Nunito',sans-serif;
    font-size:1rem;
    color:#7c3aed;
    padding-bottom:10px;
    min-height:1.4em;
    opacity:0;
    transition:opacity 0.3s;
  "></div>
</div>

<!-- ═══════════════ MATH ═══════════════ -->
<div id="math-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="math-label">Question 1 of 10</div>
    <div style="width:52px;flex-shrink:0"></div>
  </div>

  <div class="math-display" id="math-display"></div>

  <div class="math-choices" id="math-choices"></div>

  <div class="progress-row" id="math-progress-row"></div>
</div>

<!-- ═══════════════ SIGHT WORDS ═══════════════ -->
<div id="sight-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="sight-label">Word 1 of 10</div>
    <div style="width:52px;flex-shrink:0"></div>
  </div>

  <div class="sight-listen-wrap">
    <button id="sight-listen-btn" class="listen-btn" onclick="speakWord(currentWord)">🔊 Hear it again!</button>
  </div>

  <div id="sight-grid" class="sight-grid"></div>

  <div class="progress-row" id="sight-progress-row"></div>
</div>

<!-- ═══════════════ ARABIC LETTERS ═══════════════ -->
<div id="arabic-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="arabic-label">Letter 1 of 10</div>
    <div style="width:52px;flex-shrink:0"></div>
  </div>

  <div class="arabic-listen-wrap">
    <button id="arabic-listen-btn" class="arabic-listen-btn" onclick="speakArabicLetter(currentArabicLetter)">🔊 Hear it again!</button>
  </div>

  <div id="arabic-grid" class="arabic-grid"></div>

  <div class="progress-row" id="arabic-progress-row"></div>
</div>

<!-- ═══════════════ SHAPES ═══════════════ -->
<div id="shapes-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="shapes-label">Shape 1 of 10</div>
    <div style="width:52px;flex-shrink:0"></div>
  </div>

  <div class="shapes-content-wrap" id="shapes-content-wrap"></div>

  <div class="shapes-question" id="shapes-question"></div>

  <div id="shapes-grid"></div>

  <div class="progress-row" id="shapes-progress-row"></div>
</div>

<!-- ═══════════════ MATCHING SIZE SELECT ═══════════════ -->
<div id="matching-size-screen" class="screen">
  <div class="mode-select-emoji">🚗</div>
  <div class="mode-select-title">How many tiles?</div>
  <div class="choice-row">
    <button class="btn btn-xl yellow"                                                                          onclick="startMatchingWithSize(8)">8</button>
    <button class="btn btn-xl green"                                                                           onclick="startMatchingWithSize(12)">12</button>
    <button class="btn btn-xl" style="background:#fb923c;color:#7c2d12;box-shadow:0 9px 0 rgba(0,0,0,0.22);" onclick="startMatchingWithSize(16)">16</button>
    <button class="btn btn-xl" style="background:#a78bfa;color:white;box-shadow:0 9px 0 rgba(0,0,0,0.22);"   onclick="startMatchingWithSize(20)">20</button>
  </div>
  <button class="btn btn-lg white" onclick="goHome()" style="box-shadow:0 5px 0 rgba(0,0,0,0.12);">← Back</button>
</div>

<!-- ═══════════════ MATCHING ═══════════════ -->
<div id="matching-screen" class="screen">
  <div class="top-bar">
    <button class="btn btn-icon white" onclick="goHome()" title="Home">🏠</button>
    <div class="char-label" id="matching-label">🚗 Car Match!</div>
    <div class="matching-stats">
      <div id="matching-pairs" class="matching-stat">0/6 pairs</div>
      <div id="matching-moves" class="matching-stat">Moves: 0</div>
    </div>
  </div>
  <div id="matching-grid" class="matching-grid"></div>
</div>

<!-- ═══════════════ RESULT OVERLAY ═══════════════ -->
<div id="result-overlay">
  <div class="result-card">
    <span class="result-big-emoji" id="r-emoji">🎉</span>
    <div class="result-msg" id="r-msg">Amazing!</div>
    <div class="result-sub" id="r-sub">You traced it perfectly!</div>
    <div class="stars-row"  id="r-stars"></div>
    <div class="result-btns">
      <button id="btn-try-again" class="btn btn-lg red"  onclick="tryAgain()">🔄 Try Again</button>
      <button id="btn-next"      class="btn btn-lg blue" onclick="nextChar()">Next ▶</button>
    </div>
  </div>
</div>

<script src="js/sound.js"></script>
<script src="js/tracing.js"></script>
<script src="js/math.js"></script>
<script src="js/sight.js"></script>
<script src="js/arabic.js"></script>
<script src="js/shapes.js"></script>
<script src="js/matching.js"></script>
<script src="js/main.js"></script>
</body>
</html>
